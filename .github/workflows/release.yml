name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build dan buat GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verifikasi anggaran bundle
        run: node scripts/analyze-bundle.mjs

      # Catatan rilis diambil dari CHANGELOG.md, BUKAN dari `generate_release_notes`.
      # Repo ini menerima commit langsung ke `main` tanpa PR, sehingga catatan otomatis
      # GitHub kosong. Skrip membaca seksi yang cocok dengan tag dan gagal keras bila
      # seksi itu tidak ada, supaya rilis tidak pernah terbit tanpa catatan.
      - name: Ambil catatan rilis dari CHANGELOG
        run: node scripts/release-notes.mjs > /tmp/release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
