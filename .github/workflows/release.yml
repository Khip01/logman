name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    name: Build produksi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verifikasi anggaran bundle
        run: node scripts/analyze-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Buat GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Arsipkan build
        run: tar -czf logman-${{ github.ref_name }}.tar.gz dist
      - uses: softprops/action-gh-release@v2
        with:
          files: logman-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
